<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Email</title>
<style>
  :root{
    --bg:#0f1220; --card:#171b2e; --line:#272c44; --ink:#eef1f8; --muted:#9aa3bd;
    --accent:#4f46e5; --accent-2:#6366f1; --ok:#10b981; --err:#f43f5e; --radius:16px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:
      radial-gradient(900px 500px at 80% -10%, #1d2340 0, transparent 60%),
      radial-gradient(700px 400px at -10% 10%, #1a1f3a 0, transparent 55%), var(--bg);
    color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:flex-start; justify-content:center; padding:40px 16px;
  }
  .wrap{width:100%; max-width:460px}
  .head{display:flex; align-items:center; gap:12px; margin-bottom:22px}
  .logo{width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-size:22px;
    background:linear-gradient(135deg,var(--accent),#8b5cf6); box-shadow:0 8px 20px rgba(79,70,229,.4)}
  .head h1{font-size:20px; margin:0} .head p{margin:2px 0 0; font-size:13px; color:var(--muted)}
  .balance{margin-left:auto; text-align:right; font-size:12px; color:var(--muted)}
  .balance b{display:block; font-size:15px; color:var(--ink)}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px; box-shadow:0 20px 40px rgba(0,0,0,.35); margin-bottom:18px}
  label{display:block; font-size:12px; color:var(--muted); margin:0 0 7px; font-weight:600; letter-spacing:.3px}
  .field{margin-bottom:18px}
  select,input{width:100%; padding:12px 14px; border-radius:11px; border:1px solid var(--line);
    background:#10142a; color:var(--ink); font-size:14px; outline:none; transition:.15s}
  select:focus,input:focus{border-color:var(--accent-2); box-shadow:0 0 0 3px rgba(99,102,241,.25)}

  .keyrow{display:flex; gap:8px}
  .keyrow input{flex:1; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px}
  .keyrow button{flex:0 0 auto; width:48px; border:1px solid var(--line); background:#10142a;
    color:var(--muted); border-radius:11px; cursor:pointer; font-size:16px; transition:.15s}
  .keyrow button:hover{background:#1a2140; color:#fff}
  .divider{height:1px; background:var(--line); margin:4px 0 18px}

  .qty{display:flex; align-items:center; gap:0; width:150px}
  .qty button{width:44px; height:46px; border:1px solid var(--line); background:#10142a; color:var(--ink);
    font-size:20px; cursor:pointer; transition:.15s; user-select:none}
  .qty button:hover{background:#1a2140; color:#fff}
  .qty button:first-child{border-radius:11px 0 0 11px}
  .qty button:last-child{border-radius:0 11px 11px 0}
  .qty input{width:62px; text-align:center; border-radius:0; border-left:0; border-right:0; -moz-appearance:textfield}
  .qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}

  .btn{width:100%; padding:14px; border:0; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer;
    color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent-2)); transition:.15s; margin-top:4px}
  .btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.6; cursor:not-allowed}

  /* status + hasil order */
  .status{font-weight:700; font-size:13px; margin:2px 0 12px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}

  /* baris email gmail hasil order */
  .mailrow{display:flex; align-items:center; gap:8px; background:#0e1226; border:1px solid var(--line);
    border-radius:11px; padding:9px 10px 9px 13px; margin-bottom:9px}
  .mailrow .mail{flex:1; min-width:0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px;
    color:#dfe6f5; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .mini{flex:0 0 auto; border:1px solid var(--line); background:#161d31; color:#cdd5e6; cursor:pointer;
    font-size:12px; font-weight:600; padding:7px 11px; border-radius:9px; transition:.15s}
  .mini:hover{background:#1f2942; color:#fff}
  .mini.copy{color:#9fb4ff} .mini.react{color:#7ee0b8; border-color:rgba(16,185,129,.35)}
  .mini:disabled{opacity:.55; cursor:not-allowed}
  .rnote{font-size:11.5px; color:var(--muted); margin:-4px 0 10px 13px}
  .rnote.ok{color:var(--ok)} .rnote.err{color:var(--err)}

  details{margin-top:6px} summary{cursor:pointer; color:var(--muted); font-size:12px}
  pre{margin:8px 0 0; white-space:pre-wrap; word-break:break-word; color:#c7cee6; font-size:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; max-height:240px; overflow:auto}

  /* inbox */
  .inbox-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px}
  .inbox-head label{margin:0}
  .btn-sm{border:1px solid var(--line); background:#10142a; color:#cdd5e6; cursor:pointer; font-size:12.5px;
    font-weight:600; padding:8px 14px; border-radius:10px; transition:.15s}
  .btn-sm:hover{background:#1a2140; color:#fff}
  .btn-sm:disabled{opacity:.6; cursor:not-allowed}
  .msg{background:#0e1226; border:1px solid var(--line); border-radius:11px; padding:11px 13px; margin-top:10px}
  .msg-top{display:flex; gap:8px; align-items:baseline; font-size:12px; color:var(--muted); margin-bottom:6px}
  .msg-top b{color:var(--ink); font-size:13px}
  .msg-body{font-size:13px; color:#dfe6f5; white-space:pre-wrap; word-break:break-word; line-height:1.55}
  .msg .mini{margin-top:8px}
  .empty{font-size:12.5px; color:var(--muted); text-align:center; padding:8px 0}

  .foot{text-align:center; margin-top:2px; font-size:11.5px; color:var(--muted); line-height:1.6}
  .spinner{display:inline-block; width:15px; height:15px; border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:7px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="logo">📧</div>
      <div>
        <h1>Order Email</h1>
        <p>Sewa email untuk aktivasi akun</p>
      </div>
      <div class="balance" id="balance">Saldo<b>—</b></div>
    </div>

    <!-- ====== FORM ORDER ====== -->
    <div class="card">
      <div class="field">
        <label for="apiKey">🔐 API Key</label>
        <div class="keyrow">
          <input id="apiKey" type="password" placeholder="erb_..." autocomplete="off" spellcheck="false">
          <button type="button" id="toggleKey" title="Lihat/sembunyikan">👁</button>
        </div>
      </div>
      <div class="divider"></div>

      <div class="field">
        <label for="website">Website</label>
        <select id="website">
          <option value="digitalocean.com" selected>digitalocean.com</option>
          <option value="instagram.com">instagram.com</option>
          <option value="facebook.com">facebook.com</option>
          <option value="twitter.com">twitter.com</option>
          <option value="tiktok.com">tiktok.com</option>
          <option value="__custom">Lainnya…</option>
        </select>
      </div>
      <div class="field" id="customWrap" style="display:none">
        <label for="customWebsite">Website lain</label>
        <input id="customWebsite" placeholder="contoh.com" spellcheck="false">
      </div>

      <div class="field">
        <label for="domain">Domain</label>
        <select id="domain">
          <option value="gmail.com" selected>gmail.com</option>
          <option value="outlook.com">outlook.com</option>
          <option value="hotmail.com">hotmail.com</option>
          <option value="yahoo.com">yahoo.com</option>
          <option value="icloud.com">icloud.com</option>
          <option value="__custom">Lainnya…</option>
        </select>
      </div>
      <div class="field" id="customDomainWrap" style="display:none">
        <label for="customDomain">Domain lain</label>
        <input id="customDomain" placeholder="contoh.com" spellcheck="false">
      </div>

      <div class="field">
        <label>Quantity</label>
        <div class="qty">
          <button type="button" id="minus">−</button>
          <input id="qty" type="number" min="1" value="1">
          <button type="button" id="plus">+</button>
        </div>
      </div>

      <button class="btn" id="orderBtn">Order Sekarang</button>

      <div id="result" hidden>
        <div class="status" id="resultStatus"></div>
        <div id="orders"></div>
        <details id="rawWrap" hidden><summary>Lihat respons mentah</summary><pre id="resultBody"></pre></details>
      </div>
    </div>

    <!-- ====== INBOX ====== -->
    <div class="card">
      <div class="inbox-head">
        <label>📥 Inbox Pesan</label>
        <button class="btn-sm" id="checkInbox">Cek Pesan</button>
      </div>
      <div id="inbox"><div class="empty">Klik “Cek Pesan” untuk melihat email masuk.</div></div>
    </div>

    <div class="foot">API Key milik Anda sendiri &amp; tersimpan di browser ini saja.<br>API: api.mtc.biz.id</div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const keyInput=$('apiKey'), toggleKey=$('toggleKey');
  const websiteSel=$('website'), customWrap=$('customWrap'), customInput=$('customWebsite');
  const domainSel=$('domain'), customDomainWrap=$('customDomainWrap'), customDomainInput=$('customDomain');
  const qtyInput=$('qty'), orderBtn=$('orderBtn');
  const resultBox=$('result'), resultStatus=$('resultStatus'), ordersBox=$('orders'), rawWrap=$('rawWrap'), resultBody=$('resultBody');
  const inboxBtn=$('checkInbox'), inboxBox=$('inbox');
  const LS='ers_api_key';

  // ---- API Key
  try{ keyInput.value=localStorage.getItem(LS)||''; }catch{}
  keyInput.addEventListener('input',()=>{ try{ localStorage.setItem(LS,keyInput.value.trim()); }catch{} });
  keyInput.addEventListener('change',loadBalance);
  toggleKey.addEventListener('click',()=>{ keyInput.type=keyInput.type==='password'?'text':'password'; });
  const apiKey=()=>keyInput.value.trim();
  const headers=()=>{ const h={'Content-Type':'application/json'}; const k=apiKey(); if(k) h['X-Api-Key']=k; return h; };

  // ---- toggle "Lainnya"
  websiteSel.addEventListener('change',()=>{ const c=websiteSel.value==='__custom'; customWrap.style.display=c?'block':'none'; if(c)customInput.focus(); });
  domainSel.addEventListener('change',()=>{ const c=domainSel.value==='__custom'; customDomainWrap.style.display=c?'block':'none'; if(c)customDomainInput.focus(); });

  // ---- quantity
  function clampQty(){ let v=parseInt(qtyInput.value,10); if(isNaN(v)||v<1) v=1; qtyInput.value=v; return v; }
  $('minus').addEventListener('click',()=>{ qtyInput.value=Math.max(1,clampQty()-1); });
  $('plus').addEventListener('click',()=>{ qtyInput.value=clampQty()+1; });
  qtyInput.addEventListener('change',clampQty);

  // ---- saldo
  async function loadBalance(){
    if(!apiKey()){ $('balance').innerHTML='Saldo<b>—</b>'; return; }
    try{
      const r=await fetch('/api/profile',{headers:headers()}); const d=await r.json();
      const bal=d.balance ?? d.saldo ?? d.data?.balance;
      if(bal!=null){ const n=Number(bal); $('balance').innerHTML='Saldo<b>'+(isNaN(n)?String(bal):n.toLocaleString('id-ID'))+'</b>'; }
      else $('balance').innerHTML='Saldo<b>—</b>';
    }catch{ $('balance').innerHTML='Saldo<b>—</b>'; }
  }
  loadBalance();

  // ---- util: cari data di berbagai bentuk respons
  function extractList(d){
    if(Array.isArray(d)) return d;
    for(const k of ['data','results','result','emails','orders','list','items','messages','inbox']){
      if(Array.isArray(d&&d[k])) return d[k];
    }
    if(d && (d.email||d.mail||d.address||d.msg_id||d.subject||d.body)) return [d];
    return [];
  }
  const pick=(o,keys)=>{ for(const k of keys){ if(o&&o[k]!=null&&o[k]!=='') return o[k]; } return ''; };
  const pickEmail=(o)=>pick(o,['email','mail','address','akun','account','username','user']);
  const pickMsgId=(o)=>pick(o,['msg_id','msgId','message_id','messageId','id','order_id','trx_id']);
  const pickFrom =(m)=>pick(m,['from','sender','email_from','pengirim']);
  const pickSubj =(m)=>pick(m,['subject','title','judul']);
  const pickBody =(m)=>pick(m,['body','message','text','isi','content','pesan','snippet']);
  const pickDate =(m)=>pick(m,['date','time','created_at','tanggal','waktu']);

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ---- copy ke clipboard (dengan fallback)
  async function copyText(t){
    try{ await navigator.clipboard.writeText(t); return true; }
    catch{ try{ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove(); return true; }catch{ return false; } }
  }

  // ---- ORDER
  orderBtn.addEventListener('click', async ()=>{
    if(!apiKey()){ showStatus('err','API Key belum diisi'); keyInput.focus(); return; }
    const website=websiteSel.value==='__custom'?customInput.value.trim():websiteSel.value;
    if(!website){ showStatus('err','Website belum diisi'); return; }
    const domain=domainSel.value==='__custom'?customDomainInput.value.trim():domainSel.value;
    if(!domain){ showStatus('err','Domain belum diisi'); return; }
    const qty=clampQty();

    orderBtn.disabled=true; orderBtn.innerHTML='<span class="spinner"></span>Memproses…';
    resultBox.hidden=false; ordersBox.innerHTML=''; rawWrap.hidden=true; resultStatus.className='status';
    resultStatus.textContent='Mengirim order…';

    try{
      const r=await fetch('/api/order',{method:'POST',headers:headers(),body:JSON.stringify({website,domain,qty})});
      const data=await r.json();
      resultBody.textContent=JSON.stringify(data,null,2); rawWrap.hidden=false;
      if(r.ok){
        const list=extractList(data);
        const rows=list.map(o=>({email:pickEmail(o),msg_id:pickMsgId(o)})).filter(x=>x.email||x.msg_id);
        if(rows.length){ showStatus('ok','✔ Order berhasil'); renderOrders(rows); }
        else showStatus('ok','✔ Order berhasil (lihat respons mentah di bawah)');
      }else{
        showStatus('err','✘ Gagal (HTTP '+r.status+')');
      }
      loadBalance();
    }catch(e){ showStatus('err','✘ Error koneksi: '+e.message); }
    finally{ orderBtn.disabled=false; orderBtn.textContent='Order Sekarang'; }
  });

  function showStatus(kind,text){ resultBox.hidden=false; resultStatus.className='status '+kind; resultStatus.textContent=text; }

  // ---- render daftar gmail hasil order (Copy + Reaktivasi)
  function renderOrders(rows){
    ordersBox.innerHTML='';
    rows.forEach(row=>{
      const div=document.createElement('div'); div.className='mailrow';
      div.innerHTML =
        '<span class="mail" title="'+esc(row.email)+'">'+esc(row.email||'(email tidak terbaca)')+'</span>'+
        '<button class="mini copy">Copy</button>'+
        '<button class="mini react">Reaktivasi</button>';
      const note=document.createElement('div'); note.className='rnote'; note.hidden=true;

      const copyBtn=div.querySelector('.copy');
      copyBtn.addEventListener('click', async ()=>{
        const ok=await copyText(row.email||'');
        const old=copyBtn.textContent; copyBtn.textContent=ok?'Tersalin':'Gagal';
        setTimeout(()=>copyBtn.textContent=old,1200);
      });
      if(!row.email) copyBtn.disabled=true;

      const reactBtn=div.querySelector('.react');
      if(!row.msg_id){ reactBtn.disabled=true; reactBtn.title='msg_id tidak tersedia'; }
      reactBtn.addEventListener('click', async ()=>{
        reactBtn.disabled=true; const old=reactBtn.textContent; reactBtn.textContent='…';
        note.hidden=false; note.className='rnote'; note.textContent='Memproses reaktivasi…';
        try{
          const r=await fetch('/api/reactivate',{method:'POST',headers:headers(),body:JSON.stringify({msg_id:row.msg_id})});
          const d=await r.json();
          if(r.ok){ note.className='rnote ok'; note.textContent='✔ Reaktivasi terkirim'+(d.message?': '+d.message:''); }
          else{ note.className='rnote err'; note.textContent='✘ Gagal: '+(d.error||d.message||('HTTP '+r.status)); }
          loadBalance();
        }catch(e){ note.className='rnote err'; note.textContent='✘ Error: '+e.message; }
        finally{ reactBtn.textContent=old; reactBtn.disabled=false; }
      });

      ordersBox.appendChild(div); ordersBox.appendChild(note);
    });
  }

  // ---- INBOX
  inboxBtn.addEventListener('click', async ()=>{
    if(!apiKey()){ inboxBox.innerHTML='<div class="empty">Masukkan API Key dulu.</div>'; keyInput.focus(); return; }
    inboxBtn.disabled=true; const old=inboxBtn.textContent; inboxBtn.innerHTML='<span class="spinner"></span>';
    try{
      const r=await fetch('/api/messages',{headers:headers()}); const d=await r.json();
      if(!r.ok){ inboxBox.innerHTML='<div class="empty">✘ Gagal ('+(d.error||('HTTP '+r.status))+')</div>'; return; }
      const list=extractList(d);
      if(!list.length){ inboxBox.innerHTML='<div class="empty">Belum ada pesan masuk.</div>'; return; }
      renderInbox(list);
    }catch(e){ inboxBox.innerHTML='<div class="empty">✘ Error: '+esc(e.message)+'</div>'; }
    finally{ inboxBtn.disabled=false; inboxBtn.textContent=old; }
  });

  function renderInbox(list){
    inboxBox.innerHTML='';
    list.forEach(m=>{
      const from=pickFrom(m), subj=pickSubj(m), body=pickBody(m), date=pickDate(m);
      const div=document.createElement('div'); div.className='msg';
      div.innerHTML =
        '<div class="msg-top">'+(subj?'<b>'+esc(subj)+'</b>':'')+(from?'<span>'+esc(from)+'</span>':'')+(date?'<span>· '+esc(date)+'</span>':'')+'</div>'+
        '<div class="msg-body">'+esc(body||'(isi pesan kosong / tidak terbaca — lihat respons mentah)')+'</div>'+
        '<button class="mini copy">Copy isi</button>';
      const btn=div.querySelector('.copy');
      btn.addEventListener('click', async ()=>{ const ok=await copyText(body||''); const o=btn.textContent; btn.textContent=ok?'Tersalin':'Gagal'; setTimeout(()=>btn.textContent=o,1200); });
      inboxBox.appendChild(div);
    });
  }
</script>
</body>
</html>
